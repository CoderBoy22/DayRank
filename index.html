  "st-mocat":d=>{ const s = ui.st.moHide; s.has(d.id) ? s.delete(d.id) : s.add(d.id); render(); },
  "cal-view":d=>{ ui.cal.view = d.v; render(); },
  "cal-y":d=>{ ui.cal.year += +d.d; render(); },
  "cal-m":d=>{ ui.cal.mk = addMonths(ui.cal.mk, +d.d); render(); },
  "cal-pick":d=>{ ui.cal.sel = d.k; $$(".mday.sel").forEach(x=>x.classList.remove("sel")); $(`.mday[data-k="${d.k}"]`)?.classList.add("sel"); renderCalDetail(); if (innerWidth<860) $("#cal-detail")?.scrollIntoView({behavior:"smooth", block:"start"}); },
  "jr-type":d=>{ ui.jr.type = d.v; ui.jr.limit = 40; render(); },
  "jr-tag":d=>{ const s = ui.jr.tags; s.has(d.t) ? s.delete(d.t) : s.add(d.t); render(); },
  "jr-clear":()=>{ Object.assign(ui.jr, {q:"", tags:new Set(), from:"", to:"", limit:40}); render(); },
  "jr-more":()=>{ ui.jr.limit += 40; render(); },
  "jr-del":d=>{ ui.jr.confirm = d.type+d.k; render(); },
  "jr-del-no":()=>{ ui.jr.confirm = null; render(); },
  "jr-del-yes":d=>{ if (d.type==="d") setDay(d.k, {}); else setReview(d.k, {}); ui.jr.confirm = null; toast("Entry deleted."); render(); },
  "set-tab":d=>{ ui.set.tab = d.v; render(); },
  "ap-mode":d=>{ settings.mode = d.v; applyTheme(); saveSettings(); render(); },
  "ap-theme":d=>{ settings.theme = d.v; const p = THEMES[d.v].prefers; if (p) settings.mode = p; settings.accent = null; applyTheme(); saveSettings(); render(); },
  "ap-accent":d=>{ settings.accent = d.v || null; applyTheme(); saveSettings(); render(); },
  "ap-reset":d=>{ delete settings.custom[effMode()][d.v]; applyTheme(); saveSettings(); render(); },
  "ap-pal":d=>{ settings.palette = d.v; applyTheme(); saveSettings(); render(); },
  "ap-card-style":d=>{ settings.cardStyle = d.v; applyTheme(); saveSettings(); render(); },
  "ap-density":d=>{ settings.density = d.v; applyTheme(); saveSettings(); render(); },
  "ap-reset-all":()=>{ const s = defaultSettings(); for (const k of ["theme","mode","accent","custom","palette","radius","fontScale","cardStyle","density"]) settings[k] = clone(s[k]); applyTheme(); saveSettings(); render(); },
  "cat-move":d=>{ const arr = settings[d.kind], act = arr.filter(c=>!c.archived); const i = act.findIndex(c=>c.id===d.id), j = i + +d.d; if (j<0||j>=act.length) return; const A = arr.indexOf(act[i]), B = arr.indexOf(act[j]); [arr[A],arr[B]] = [arr[B],arr[A]]; saveSettings(); render(); },
  "cat-archive":d=>{ const c = settings[d.kind].find(c=>c.id===d.id); if (c){ c.archived = true; saveSettings(); render(); } },
  "cat-restore":d=>{ const c = settings[d.kind].find(c=>c.id===d.id); if (c){ c.archived = false; saveSettings(); render(); } },
  "cat-add":d=>{ const inp = $("#new-"+d.kind); const name = inp.value.trim(); if (!name) return; let id = name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "cat"; while (settings[d.kind].some(c=>c.id===id)) id += "-"+uid().slice(0,3);
    settings[d.kind].push(d.kind==="daily" ? {id, name, q:"", of:10} : {id, name, short:name.split(" ")[0].slice(0,12), of:10}); saveSettings(); render(); },
  "g-week":d=>{ settings.weekStart = +d.v; bump(); saveSettings(); render(); },
  "g-tag-del":d=>{ settings.tags = settings.tags.filter(t=>t!==d.t); saveSettings(); render(); },
  "g-tag-add":()=>{ const v = $("#g-newtag").value.trim().toLowerCase(); if (v && !settings.tags.includes(v)){ settings.tags.push(v); saveSettings(); } render(); },
  "export-json":exportJSON, "export-csv":exportCSV,
  "import":()=>$("#import-file").click(),
  "erase":()=>{ if (ui.set.erase==="DELETE") eraseAll(); }
};
function renderKeep(){ const y = window.scrollY; render(); window.scrollTo(0, y); }
function flushText(){ if (rvTextTimer){ clearTimeout(rvTextTimer); rvTextTimer = null; rvTextSave(); } if (moTextTimer){ clearTimeout(moTextTimer); moTextTimer = null; moTextSave(); } }
let catTimer = null, apTimer = null;
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  const d = el.dataset;
  switch (k){
    case "rv-text": clearTimeout(rvTextTimer); { const st = $("#rv-state"); if (st) st.textContent = "Saving…"; } rvTextTimer = setTimeout(()=>{ rvTextTimer = null; rvTextSave(); }, 700); break;
    case "mo-text": clearTimeout(moTextTimer); { const st = $("#mo-state"); if (st) st.textContent = "Saving…"; } moTextTimer = setTimeout(()=>{ moTextTimer = null; moTextSave(); }, 700); break;
    case "jr-q": ui.jr.q = el.value; ui.jr.limit = 40; clearTimeout(catTimer); catTimer = setTimeout(()=>{ const pos = el.selectionStart; render(); const n = $("#jr-q"); if (n){ n.focus(); try { n.setSelectionRange(pos,pos); } catch {} } }, 220); break;
    case "erase": ui.set.erase = el.value; { const b = $('[data-act="erase"]'); if (b) b.disabled = el.value!=="DELETE"; } break;
    case "ap-radius": settings.radius = +el.value; applyTheme(); el.closest(".set-row").querySelector("small").textContent = el.value+"px"; clearTimeout(apTimer); apTimer = setTimeout(saveSettings, 400); break;
    case "ap-font": settings.fontScale = +el.value; applyTheme(); el.closest(".set-row").querySelector("small").textContent = Math.round(el.value*100)+"%"; clearTimeout(apTimer); apTimer = setTimeout(saveSettings, 400); break;
    case "ap-accent": settings.accent = el.value; applyTheme(); clearTimeout(apTimer); apTimer = setTimeout(saveSettings, 400); break;
    case "ap-bg": case "ap-card": settings.custom[effMode()][k==="ap-bg"?"bg":"card"] = el.value; applyTheme(); clearTimeout(apTimer); apTimer = setTimeout(saveSettings, 400); break;
    case "cat-name": case "cat-q": case "cat-short": { const kind = d.kind || (k==="cat-q"?"daily":"monthly"); const c = settings[kind].find(c=>c.id===d.id); if (!c) break;
      if (k==="cat-name") c.name = el.value.slice(0,60) || c.name; else if (k==="cat-q") c.q = el.value.slice(0,120); else c.short = el.value.slice(0,16);
      clearTimeout(catTimer); catTimer = setTimeout(saveSettings, 600); break; }
  }
});
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset && el.dataset.in;
  if (el.id==="import-file"){ const f = el.files && el.files[0]; if (f) importFile(f); el.value = ""; return; }
  if (!k) return; const d = el.dataset;
  switch (k){
    case "rv-date": if (el.value){ ui.rv.date = el.value > todayKey() ? todayKey() : el.value; ui.confirmDel=false; render(); } break;
    case "rv-range": { const [kk,ev] = rvGet(); const cat = activeDaily().find(c=>c.id===d.id); ev.r = (ev.r||[]).filter(x=>x[0]!==d.id); ev.r.push([d.id, +el.value, cat.of]); setDay(kk, ev); renderKeep(); break; }
    case "mo-range": { const [mk,rv] = moGet(); const cat = activeMonthly().find(c=>c.id===d.id); rv.r = (rv.r||[]).filter(x=>x[0]!==d.id); rv.r.push([d.id, +el.value, cat.of]); setReview(mk, rv); renderKeep(); break; }
    case "rv-newtag": break;
    case "st-ma": ui.st.ma = el.checked; render(); break;
    case "st-from": ui.st.from = el.value; render(); break;
    case "st-to": ui.st.to = el.value; render(); break;
    case "st-a": ui.st.a = el.value; render(); break;
    case "st-b": ui.st.b = el.value; render(); break;
    case "jr-from": ui.jr.from = el.value; render(); break;
    case "jr-to": ui.jr.to = el.value; render(); break;
    case "cat-of": { const c = settings[d.kind].find(c=>c.id===d.id); if (c){ c.of = +el.value; saveSettings(); } break; }
    case "g-daystart": settings.dayStart = +el.value; saveSettings(); render(); break;
    case "cat-name": case "cat-q": case "cat-short": render(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && !$("#sheet").hidden) closeSheet();
  const el = e.target;
  if (e.key==="Enter" && el.id==="rv-newtag"){ e.preventDefault(); const v = el.value.trim().toLowerCase().slice(0,30); if (!v) return; flushText(); const [k,ev] = rvGet(); ev.tags = [...new Set([...(ev.tags||[]), v])]; if (!settings.tags.includes(v)){ settings.tags.push(v); saveSettings(); } setDay(k, ev); renderKeep(); $("#rv-newtag")?.focus(); }
  if (e.key==="Enter" && el.id==="g-newtag"){ e.preventDefault(); ACTIONS["g-tag-add"](); }
  if (e.key==="Enter" && /^new-(daily|monthly)$/.test(el.id)){ e.preventDefault(); ACTIONS["cat-add"]({kind:el.id.slice(4)}); }
});
window.addEventListener("pagehide", ()=>{ flushText(); if (P.timer){ clearTimeout(P.timer); flush(); } });
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="hidden"){ flushText(); if (P.timer){ clearTimeout(P.timer); flush(); } } });
let rzT = null, lastW = innerWidth;
window.addEventListener("resize", ()=>{ clearTimeout(rzT); rzT = setTimeout(()=>{ if (Math.abs(innerWidth-lastW) < 40) return; lastW = innerWidth; if (["dashboard","stats","calendar"].includes(ui.route)) render(); }, 200); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if (settings.mode==="system"){ applyTheme(); render(); } }); } catch {}
new MutationObserver(()=>{ if (settings.mode==="system"){ applyTheme(); if (P.ready) render(); } }).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

boot();
</script>
</body>
</html>
